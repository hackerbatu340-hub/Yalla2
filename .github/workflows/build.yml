name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android projesini üret
        run: flutter create --project-name sesli_oda --org com.example --platforms android .

      - name: minSdk 24 yap
        run: |
          f=android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' $f || true
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' $f || true
          grep -n "minSdk" $f

      - name: Mikrofon ve internet izinleri
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application|' $f
          cat $f

      - run: flutter pub get

      - run: flutter build apk --release

      - name: APK yükle (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Releases'e ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sesli Oda build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
